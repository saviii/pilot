name: TVRemote
options:
  bundleIdPrefix: fyi.savi
  deploymentTarget:
    iOS: "17.0"
targets:
  TVRemote:
    type: application
    platform: iOS
    sources: [TVRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.savi.tvremote
        DEVELOPMENT_TEAM: 7V37E9XS66
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: TVRemote/Info.plist
      properties:
        CFBundleDisplayName: TV Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [Doto.ttf, MartianMono.ttf]
        NSLocalNetworkUsageDescription: TV Remote talks to your LG TV over your home Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
