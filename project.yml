name: TVRemote
options:
  bundleIdPrefix: fyi.savi
  deploymentTarget:
    iOS: "17.0"
packages:
  PilotKit:
    path: PilotKit
targets:
  TVRemote:
    type: application
    platform: iOS
    sources: [TVRemote, Shared]
    dependencies:
      - target: PilotWidgets
      - package: PilotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.savi.tvremote
        DEVELOPMENT_TEAM: 7V37E9XS66
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP"
    info:
      path: TVRemote/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Doto.ttf, MartianMono.ttf]
        NSSupportsLiveActivities: true
        NSPhotoLibraryAddUsageDescription: Pilot saves TV screenshots to your photos.
        NSLocalNetworkUsageDescription: Pilot talks to your LG TV over your home Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  PilotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: TVRemote/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.savi.tvremote.widgets
        DEVELOPMENT_TEAM: 7V37E9XS66
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        UIAppFonts: [Doto.ttf, MartianMono.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
