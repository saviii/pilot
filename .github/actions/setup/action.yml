name: Setup
description: XcodeGen (pinned, so the generated project matches) and the build cache.
runs:
  using: composite
  steps:
    - name: XcodeGen 2.46.0
      shell: bash
      run: |
        curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
        unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
        echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
    - name: Versions
      shell: bash
      run: xcodebuild -version && swift --version
    - uses: actions/cache@v4
      with:
        path: |
          build/dd
          PilotKit/.build
        key: dd-${{ runner.os }}-${{ hashFiles('project.yml', 'PilotKit/Package.swift') }}-${{ github.sha }}
        restore-keys: dd-${{ runner.os }}-${{ hashFiles('project.yml', 'PilotKit/Package.swift') }}-
